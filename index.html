
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Raíz | Entrenamiento y nutrición</title>
    <meta name="description"
          content="Tu plan de entrenamiento, nutrición y seguimiento personal en un solo lugar.">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
          rel="stylesheet">

    <style>
        /* ========================================
           1. VARIABLES Y CONFIGURACIÓN GENERAL
        ======================================== */

        :root {
            --cream: #f7f5ed;
            --forest: #2e4b3a;
            --forest-dark: #243d2f;
            --sage: #d8e7d4;
            --sage-icon: #8fb894;
            --terracotta: #f2763e;
            --text: #17241d;
            --muted: #59675e;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background-color: var(--cream);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ========================================
           2. ENCABEZADO
        ======================================== */

        .site-header {
            min-height: 80px;
            padding: 20px 0;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 25px;
            font-weight: 800;
            color: var(--forest);
            letter-spacing: -0.7px;
        }

        .brand:hover {
            color: var(--forest-dark);
        }

        .login-link {
            font-size: 14px;
            font-weight: 500;
            color: #111;
            transition: color 0.2s ease;
        }

        .login-link:hover {
            color: var(--terracotta);
        }

        /* ========================================
           3. SECCIÓN PRINCIPAL
        ======================================== */

        .hero {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: flex-start;
            padding-top: 32px;
            padding-bottom: 70px;
        }

        .hero-row {
            align-items: center;
        }

        .hero-content {
            padding-top: 4px;
            padding-right: 36px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            padding: 6px 13px;
            margin-bottom: 17px;
            border-radius: 50px;
            background-color: var(--sage);
            color: var(--forest-dark);
            font-size: 14px;
            font-weight: 400;
        }

        /* ========================================
           4. TÍTULO
        ======================================== */

        .hero-title {
            max-width: 560px;
            margin: 0 0 25px;
            color: var(--forest);
            font-family: 'Playfair Display', serif;
            font-size: clamp(40px, 4.2vw, 60px);
            font-weight: 800;
            line-height: 1.06;
            letter-spacing: -1.8px;
        }

        .hero-title .highlight {
            color: var(--terracotta);
            font-style: italic;
        }

        .hero-description {
            max-width: 455px;
            margin-bottom: 32px;
            color: var(--muted);
            font-size: 17px;
            font-weight: 400;
            line-height: 1.65;
        }

        /* ========================================
           5. BOTÓN PRINCIPAL
        ======================================== */

        .btn-primary-custom {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 131px;
            min-height: 41px;
            padding: 10px 24px;
            border: 0;
            border-radius: 13px;
            background-color: var(--forest);
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 3px 5px rgb(0 0 0 / 8%);
            transition:
                background-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .btn-primary-custom:hover {
            background-color: var(--forest-dark);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgb(0 0 0 / 10%);
        }

        .btn-primary-custom:focus-visible,
        .login-link:focus-visible,
        .feature-link:focus-visible {
            outline: 3px solid var(--terracotta);
            outline-offset: 4px;
        }

        /* ========================================
           6. ACCESOS RÁPIDOS
        ======================================== */

        .features {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 25px;
            margin-top: 47px;
        }

        .feature-link {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            min-width: 155px;
            border-radius: 12px;
            font-size: 14px;
            color: var(--text);
            transition: transform 0.2s ease;
        }

        .feature-link:hover {
            transform: translateY(-2px);
        }

        .feature-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 37px;
            height: 37px;
            border-radius: 50%;
            background-color: var(--sage-icon);
            color: #172b1c;
            font-size: 16px;
        }

        /* ========================================
           7. IMAGEN PRINCIPAL
        ======================================== */

        .hero-image-wrapper {
            width: 100%;
            height: 528px;
            overflow: hidden;
            border-radius: 32px;
            background-color: #e8e5d9;
            box-shadow: 0 8px 20px rgb(44 57 43 / 7%);
        }

        .hero-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.6s ease;
        }

        .hero-image-wrapper:hover .hero-image {
            transform: scale(1.025);
        }

        /* ========================================
           8. TABLETAS
        ======================================== */

        @media (max-width: 991.98px) {
            .hero {
                padding-top: 24px;
            }

            .hero-content {
                padding-right: 12px;
            }

            .hero-title {
                font-size: clamp(37px, 5vw, 49px);
                letter-spacing: -1.2px;
            }

            .hero-description {
                font-size: 16px;
            }

            .hero-image-wrapper {
                height: 440px;
                border-radius: 27px;
            }

            .features {
                gap: 18px;
                margin-top: 36px;
            }

            .feature-link {
                min-width: 125px;
            }
        }

        /* ========================================
           9. MÓVILES
        ======================================== */

        @media (max-width: 767.98px) {
            .site-header {
                min-height: 72px;
                padding: 18px 0;
            }

            .brand {
                font-size: 24px;
            }

            .hero {
                min-height: auto;
                padding-top: 28px;
                padding-bottom: 42px;
            }

            .hero-row {
                row-gap: 34px;
            }

            .hero-content {
                padding-right: 12px;
            }

            .eyebrow {
                margin-bottom: 17px;
                font-size: 13px;
            }

            .hero-title {
                max-width: 530px;
                margin-bottom: 20px;
                font-size: clamp(39px, 8.5vw, 54px);
                line-height: 1.08;
                letter-spacing: -1.4px;
            }

            .hero-description {
                max-width: 500px;
                margin-bottom: 25px;
                font-size: 16px;
                line-height: 1.65;
            }

            .features {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 12px;
                margin-top: 34px;
            }

            .feature-link {
                min-width: 0;
                gap: 7px;
                font-size: 13px;
            }

            .feature-icon {
                width: 34px;
                height: 34px;
                font-size: 15px;
            }

            .hero-image-wrapper {
                height: auto;
                aspect-ratio: 1 / 0.92;
                border-radius: 25px;
            }
        }

        /* ========================================
           10. MÓVILES PEQUEÑOS
        ======================================== */

        @media (max-width: 380px) {
            .container {
                --bs-gutter-x: 1.5rem;
            }

            .hero-title {
                font-size: 37px;
            }

            .features {
                gap: 8px;
            }

            .feature-link {
                gap: 5px;
                font-size: 12px;
            }

            .feature-icon {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }

            .hero-image-wrapper {
                aspect-ratio: 1 / 1;
            }
        }

        /* ========================================
           11. ACCESIBILIDAD
        ======================================== */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="site-header">
        <div class="container-fluid px-4 px-md-4 px-lg-5">
            <nav class="d-flex justify-content-between align-items-center"
                 aria-label="Navegación principal">

                <a href="#" class="brand" aria-label="Raíz, página de inicio">
                    Raíz
                </a>

                <a href="login.html" class="login-link">
                    Iniciar sesión
                </a>

            </nav>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <section class="hero">
            <div class="container-fluid px-4 px-md-4 px-lg-5">
                <div class="row hero-row g-4 g-lg-4">

                    <!-- COLUMNA IZQUIERDA -->
                    <div class="col-12 col-md-6 col-lg-6">
                        <div class="hero-content">

                            <span class="eyebrow">
                                Entrenamiento + nutrición
                            </span>

                            <h1 class="hero-title">
                                Tu plan,
                                <span class="highlight">claro</span>
                                y siempre contigo.
                            </h1>

                            <p class="hero-description">
                                Revisa tus citas, sigue tu rutina del día,
                                consulta tu dieta y anota cada serie que completes.
                            </p>

                            <a href="login.html" class="btn btn-primary-custom">
                                Comenzar
                            </a>

                            <!-- ACCESOS RÁPIDOS -->
                            <nav class="features" aria-label="Servicios">

                                <a href="citas.html" class="feature-link">
                                    <span class="feature-icon">
                                        <i class="bi bi-calendar3"
                                           aria-hidden="true"></i>
                                    </span>
                                    <span>Citas</span>
                                </a>

                                <a href="rutinas.html" class="feature-link">
                                    <span class="feature-icon">
                                        <i class="bi bi-universal-access"
                                           aria-hidden="true"></i>
                                    </span>
                                    <span>Rutinas</span>
                                </a>

                                <a href="dietas.html" class="feature-link">
                                    <span class="feature-icon">
                                        <i class="bi bi-egg-fried"
                                           aria-hidden="true"></i>
                                    </span>
                                    <span>Dietas</span>
                                </a>

                            </nav>
                        </div>
                    </div>

                    <!-- COLUMNA DERECHA: FOTOGRAFÍA -->
                    <div class="col-12 col-md-6 col-lg-6">
                        <div class="hero-image-wrapper">
                            <img
                                class="hero-image"
                                src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=1400&q=85"
                                alt="Comida saludable con vegetales frescos"
                                fetchpriority="high"
                            >
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <!-- Bootstrap JS: disponible para componentes futuros -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
